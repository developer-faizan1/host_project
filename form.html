<!-- =====================================
     VALIDATION JAVASCRIPT
====================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("contactForm");

  const name = document.getElementById("name");
  const email = document.getElementById("email");
  const phone = document.getElementById("phone");
  const subject = document.getElementById("subject");
  const department = document.getElementById("department");
  const message = document.getElementById("message");

  const charCount = document.getElementById("charCount");
  const submitBtn = document.getElementById("submitBtn");


  /* =====================================
     HELPER FUNCTIONS
  ====================================== */

  function getWrapper(field) {

    return field.closest(
      ".input-wrapper, .textarea-wrapper, .select-wrapper"
    );

  }


  function setError(field, errorId, message) {

    const errorElement = document.getElementById(errorId);
    const wrapper = getWrapper(field);

    field.classList.remove("success");
    field.classList.add("error");

    if (wrapper) {
      wrapper.classList.remove("success");
      wrapper.classList.add("error");
    }

    errorElement.textContent = message;

  }


  function setSuccess(field, errorId) {

    const errorElement = document.getElementById(errorId);
    const wrapper = getWrapper(field);

    field.classList.remove("error");
    field.classList.add("success");

    if (wrapper) {
      wrapper.classList.remove("error");
      wrapper.classList.add("success");
    }

    errorElement.textContent = "";

  }


  /* =====================================
     NAME VALIDATION
  ====================================== */

  function validateName() {

    const value = name.value.trim();

    if (value === "") {

      setError(
        name,
        "nameError",
        "Please enter your name."
      );

      return false;

    }

    if (value.length < 2) {

      setError(
        name,
        "nameError",
        "Name must contain at least 2 characters."
      );

      return false;

    }

    const namePattern = /^[A-Za-zÀ-ÿ.'\-\s]+$/;

    if (!namePattern.test(value)) {

      setError(
        name,
        "nameError",
        "Please enter a valid name."
      );

      return false;

    }

    setSuccess(name, "nameError");

    return true;

  }


  /* =====================================
     EMAIL VALIDATION
  ====================================== */

  function validateEmail() {

    const value = email.value.trim();

    if (value === "") {

      setError(
        email,
        "emailError",
        "Please enter your email address."
      );

      return false;

    }

    const emailPattern =
      /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

    if (!emailPattern.test(value)) {

      setError(
        email,
        "emailError",
        "Please enter a valid email address."
      );

      return false;

    }

    setSuccess(email, "emailError");

    return true;

  }


  /* =====================================
     PHONE VALIDATION
  ====================================== */

  function validatePhone() {

    const value = phone.value.trim();

    if (value === "") {

      setError(
        phone,
        "phoneError",
        "Please enter your phone number."
      );

      return false;

    }

    /*
      Examples accepted:

      +971501234567
      +971 50 123 4567
      +91 9876543210
      0501234567
    */

    const phonePattern =
      /^\+?[0-9\s\-()]{7,20}$/;

    if (!phonePattern.test(value)) {

      setError(
        phone,
        "phoneError",
        "Please enter a valid phone number."
      );

      return false;

    }

    setSuccess(phone, "phoneError");

    return true;

  }


  /* =====================================
     SUBJECT VALIDATION
  ====================================== */

  function validateSubject() {

    const value = subject.value.trim();

    if (value === "") {

      setError(
        subject,
        "subjectError",
        "Please enter a subject."
      );

      return false;

    }

    if (value.length < 3) {

      setError(
        subject,
        "subjectError",
        "Subject must contain at least 3 characters."
      );

      return false;

    }

    setSuccess(subject, "subjectError");

    return true;

  }


  /* =====================================
     DEPARTMENT VALIDATION
  ====================================== */

  function validateDepartment() {

    if (department.value === "") {

      setError(
        department,
        "departmentError",
        "Please select a department."
      );

      return false;

    }

    setSuccess(
      department,
      "departmentError"
    );

    return true;

  }


  /* =====================================
     MESSAGE VALIDATION
  ====================================== */

  function validateMessage() {

    const value = message.value.trim();

    if (value === "") {

      setError(
        message,
        "messageError",
        "Please enter your message."
      );

      return false;

    }

    if (value.length < 10) {

      setError(
        message,
        "messageError",
        "Message must contain at least 10 characters."
      );

      return false;

    }

    if (value.length > 1000) {

      setError(
        message,
        "messageError",
        "Message cannot exceed 1000 characters."
      );

      return false;

    }

    setSuccess(
      message,
      "messageError"
    );

    return true;

  }


  /* =====================================
     CHARACTER COUNTER
  ====================================== */

  message.addEventListener("input", function () {

    charCount.textContent = message.value.length;

  });


  /* =====================================
     LIVE VALIDATION
  ====================================== */

  name.addEventListener("blur", validateName);

  email.addEventListener("blur", validateEmail);

  phone.addEventListener("blur", validatePhone);

  subject.addEventListener("blur", validateSubject);

  department.addEventListener(
    "change",
    validateDepartment
  );

  message.addEventListener(
    "blur",
    validateMessage
  );


  /* =====================================
     REMOVE ERROR WHILE USER TYPES
  ====================================== */

  name.addEventListener("input", function () {

    if (name.classList.contains("error")) {
      validateName();
    }

  });


  email.addEventListener("input", function () {

    if (email.classList.contains("error")) {
      validateEmail();
    }

  });


  phone.addEventListener("input", function () {

    if (phone.classList.contains("error")) {
      validatePhone();
    }

  });


  subject.addEventListener("input", function () {

    if (subject.classList.contains("error")) {
      validateSubject();
    }

  });


  message.addEventListener("input", function () {

    if (message.classList.contains("error")) {
      validateMessage();
    }

  });


  /* =====================================
     FORM SUBMISSION
  ====================================== */

  form.addEventListener("submit", function (event) {

    event.preventDefault();

    const validName = validateName();
    const validEmail = validateEmail();
    const validPhone = validatePhone();
    const validSubject = validateSubject();
    const validDepartment = validateDepartment();
    const validMessage = validateMessage();


    const isValid =
      validName &&
      validEmail &&
      validPhone &&
      validSubject &&
      validDepartment &&
      validMessage;


    if (!isValid) {

      const firstError =
        form.querySelector(".error");

      if (firstError) {
        firstError.focus();
      }

      return;

    }


    /*
      Everything is valid.

      Submit the form to PHP.
    */

    submitBtn.disabled = true;

    submitBtn.querySelector("span").textContent =
      "Sending...";


    form.submit();

  });

});

</script>
